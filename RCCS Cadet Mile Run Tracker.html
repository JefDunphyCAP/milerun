<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCCS Cadet Mile Run Tracker</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mute:#5b6577;--acc:#1d4ed8;--ok:#15803d;--line:#d5dae3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa6bd;--acc:#6b9bff;--ok:#4ade80;--line:#2b3956}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:640px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1}
button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.on,button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.clock{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.m{color:var(--mute);font-size:.9rem}.t{font-variant-numeric:tabular-nums;font-weight:600}.done .t{color:var(--ok)}
input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.g{display:flex;gap:8px;flex-wrap:wrap}.g>*{flex:1}
.big{padding:14px 18px;min-width:96px}.big:active{transform:scale(.97)}.msg{min-height:1.4em;color:var(--mute)}.tbl{overflow-x:auto}
</style></head><body>
<h1>RCCS Cadet Mile Run Tracker</h1>
<nav><button data-v="run" class="on">Run</button><button data-v="roster">Roster</button><button data-v="hist">History</button></nav>
<div id="msg" class="msg" role="status"></div>
<main id="app"></main>
<script>
var db=null,today=[],cad=[],res=[],cur={start:null,runId:null},view='run',tick=null,ready=false,q='';
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function say(t){document.getElementById('msg').textContent=t}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fin(){var o={};res.filter(function(r){return r.runId===cur.runId}).forEach(function(r){o[r.cadetId]=r.ms});return o}
function fail(e){say('Could not save: '+(e&&e.message||e)+'. You may need Contributor access.')}
function finish(id){
  var c=cad.find(function(x){return x.id===id});if(!c||!cur.start||cur.stopped)return;
  var f=fin();if(f[id]!=null)return;var ms=Date.now()-cur.start;
  db.doc('results/'+cur.runId+'_'+id).set({runId:cur.runId,cadetId:id,name:c.name,capid:c.capid||'',ms:ms,date:cur.runId.slice(0,10)}).then(function(){say(c.name+': '+fmt(ms))}).catch(fail)}
function undo(id){var c=cad.find(function(x){return x.id===id});db.doc('results/'+cur.runId+'_'+id).delete().then(function(){say('Cleared time for '+(c?c.name:id)+'.')}).catch(fail)}
function stopRun(){db.doc('state/current').set({start:cur.start,runId:cur.runId,stopped:Date.now()}).then(function(){say('Clock stopped. Finish buttons are paused.')}).catch(fail)}
function resumeRun(){db.doc('state/current').set({start:cur.start+(Date.now()-cur.stopped),runId:cur.runId}).then(function(){say('Clock resumed.')}).catch(fail)}
var pend=null;
function sure(key,msg){if(pend===key){pend=null;return true}pend=key;say(msg+' Tap again to confirm.');setTimeout(function(){if(pend===key){pend=null;say('')}},5000);return false}
function part(){return cad.filter(function(c){return today.indexOf(c.id)>-1})}
function toggle(id,on){var a=today.filter(function(x){return x!==id});if(on)a.push(id);db.doc('state/today').set({ids:a}).catch(fail)}
function selAll(on){db.doc('state/today').set({ids:on?cad.map(function(c){return c.id}):[]}).catch(fail)}
function startOrPick(){if(!today.length){view='roster';say('Tick who is running today, then come back and press Start.');render();return}startRun()}
function startRun(){var d=new Date();db.doc('state/current').set({start:d.getTime(),runId:d.toISOString().slice(0,16)}).catch(fail)}
function endRun(){var n=Object.keys(fin()).length;if(n<part().length&&!sure('save',(part().length-n)+' cadets have no time. Save the run anyway?'))return;
  db.doc('state/current').set({start:null,runId:null}).then(function(){return db.doc('state/today').set({ids:[]})}).then(function(){say('Run saved.');view='hist';render()}).catch(fail)}
function discard(){if(!sure('reset','Reset the timer? This clears all times for this run.'))return;var rid=cur.runId;
  Promise.all(res.filter(function(r){return r.runId===rid}).map(function(r){return db.doc('results/'+r.runId+'_'+r.cadetId).delete()})).then(function(){return db.doc('state/current').set({start:null,runId:null})}).catch(fail)}
function addCadet(){
  var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),c=document.getElementById('ci').value.trim();
  if(!f||!l){say('Enter a first name and a last name.');return}
  var nm=l+', '+f;
  if(cad.some(function(x){return x.name.toLowerCase()===nm.toLowerCase()})){say(nm+' is already on the roster.');return}
  var mx=0;cad.forEach(function(x){var m=parseInt(x.id.slice(1));if(m>mx)mx=m});
  var id='C'+String(mx+1).padStart(3,'0');
  db.doc('cadets/'+id).set({name:nm,first:f,last:l,capid:c}).then(function(){['fn','ln','ci'].forEach(function(k){document.getElementById(k).value=''});if(document.activeElement)document.activeElement.blur();say('Added '+nm+'.');render()}).catch(fail)}
function delCadet(id){if(sure('del'+id,'Remove this cadet? Past results stay.'))db.doc('cadets/'+id).delete().catch(fail)}
async function csv(){
  var rows=['date,last_name,first_name,cap_id,mile_time'];res.slice().sort(function(a,b){return a.runId<b.runId?1:-1}).forEach(function(x){rows.push([x.date,'"'+x.name.split(', ')[0]+'"','"'+(x.name.split(', ')[1]||'')+'"',x.capid||'',fmt(x.ms)].join(','))});
  try{var d=await claude.use('downloads');if(d)await d.save({filename:'mile-run-history.csv',data:rows.join('\n')});else say('Download not available here.')}catch(e){say('Download cancelled.')}}
function copyRun(k){
  var rows=res.filter(function(r){return r.runId===k}).sort(function(a,b){return a.ms-b.ms});
  var t='Last name\tFirst name\tCAP ID\tMile time\n'+rows.map(function(r){var p=r.name.split(', ');return p[0]+'\t'+(p[1]||'')+'\t'+(r.capid||'')+'\t'+fmt(r.ms)}).join('\n');
  function ok(){say('Copied '+rows.length+' results. Paste into a Google Sheet.')}
  function old(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(a);if(s)ok();else say('Copy was blocked. Use Export CSV instead.')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(old)}else old()}
function setQ(v){q=v.toLowerCase();renderList()}
function renderList(){
  var el=document.getElementById('list');if(!el)return;var f=fin();
  var open=part().filter(function(c){return f[c.id]==null&&c.name.toLowerCase().indexOf(q)>-1});
  var done=part().filter(function(c){return f[c.id]!=null&&c.name.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return f[a.id]-f[b.id]});
  document.getElementById('cnt').textContent='Finished '+Object.keys(f).length+' of '+part().length
  el.innerHTML=open.map(function(c){return'<div class="row"><span>'+esc(c.name)+' <span class="m">'+esc(c.capid)+'</span></span><button class="p big"'+(cur.stopped?' disabled':'')+' onclick="finish(\''+c.id+'\')">Finish</button></div>'}).join('')+
   done.map(function(c){return'<div class="row done"><span>'+esc(c.name)+'</span><span><span class="t">'+fmt(f[c.id])+'</span> <button onclick="undo(\''+c.id+'\')">Undo</button></span></div>'}).join('')||'<p class="m">No names match.</p>'}
function render(){
  if(!ready)return;clearInterval(tick);var h='';
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});
  if(view==='run'){
    if(!cad.length){h='<div class="card"><h2>No cadets yet</h2><p class="m">Open the Roster tab and paste your cadet names, one per line.</p></div>'}
    else if(!cur.start){h='<div class="card"><h2>New mile run</h2><p class="m">'+part().length+' of '+cad.length+' cadets are running today (choose them on the Roster tab). Press Start when the cadets go, then press Finish next to each name as they cross the line. Everyone with access sees times live.</p><button class="p big" style="width:100%" onclick="startOrPick()">Start run</button></div>'+'<div class="card"><h2>Running today ('+part().length+')</h2>'+(part().length?part().map(function(c){return'<div class="row"><span>'+esc(c.name)+' <span class="m">'+esc(c.capid)+'</span></span><button onclick="toggle(\''+c.id+'\',false)" aria-label="Remove '+esc(c.name)+' from today">Remove</button></div>'}).join(''):'<p class="m">Nobody is selected yet. Open the Roster tab and tick the cadets running today.</p>')+'</div>'}
    else{h='<div class="card" style="position:sticky;top:0;z-index:5"><div class="clock" id="clk">0:00</div><div id="cnt" class="m" style="text-align:center"></div><input id="s" placeholder="Search names" aria-label="Search names" style="margin-top:8px" oninput="setQ(this.value)" value="'+esc(q)+'"><div class="g" style="margin-top:8px"><button onclick="'+(cur.stopped?'resumeRun()':'stopRun()')+'">'+(cur.stopped?'Resume':'Stop')+'</button><button onclick="endRun()">Save run</button><button onclick="discard()">Reset</button></div></div><div class="card" id="list"></div>';
      tick=setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=fmt((cur.stopped||Date.now())-cur.start)},500)}
  }else if(view==='roster'){
    h='<div class="card"><h2>Running today ('+today.length+' of '+cad.length+')</h2><p class="m">Tick the cadets running the mile in the list below. The Run tab shows only these. The selection clears when you save a run.</p><div class="g"><button onclick="selAll(true)">Select all</button><button onclick="selAll(false)">Clear</button></div></div><div class="card"><h2>Add a cadet</h2><div class="g"><input id="fn" placeholder="First name" aria-label="First name"><input id="ln" placeholder="Last name" aria-label="Last name"></div><input id="ci" inputmode="numeric" placeholder="CAP ID" aria-label="CAP ID" style="margin-top:8px"><button class="p" style="width:100%;margin-top:8px" onclick="addCadet()">Add cadet</button></div>'+
      '<div class="card"><h2>Cadets ('+cad.length+')</h2>'+(cad.length?cad.map(function(r){return'<div class="row"><label style="display:flex;gap:10px;align-items:center;flex:1"><input type="checkbox" style="width:24px;height:24px;padding:0;flex:0 0 auto"'+(today.indexOf(r.id)>-1?' checked':'')+' onchange="toggle(\''+r.id+'\',this.checked)">'+esc(r.name)+' <span class="m">'+esc(r.capid)+'</span></label><button onclick="delCadet(\''+r.id+'\')" aria-label="Remove '+esc(r.name)+'">✕</button></div>'}).join(''):'<p class="m">No cadets yet. Paste your list above.</p>')+'</div>'
  }else{
    var g={};res.forEach(function(x){(g[x.runId]=g[x.runId]||[]).push(x)});var ks=Object.keys(g).sort().reverse();
    h='<div class="card"><h2>History</h2>'+(ks.length?ks.map(function(k){return'<div class="row" style="border-top:0;margin-top:12px"><h2 class="m" style="margin:0">'+k.replace('T',' ')+'</h2><button onclick="copyRun(\''+k+'\')">Copy results</button></div>'+g[k].sort(function(a,b){return a.ms-b.ms}).map(function(x){return'<div class="row"><span>'+esc(x.name)+'</span><span class="t">'+fmt(x.ms)+'</span></div>'}).join('')}).join(''):'<p class="m">No runs saved yet. Finish a run and tap Save run.</p>')+'</div>'+(ks.length?'<button style="width:100%" onclick="csv()">Export CSV</button>':'')}
  var ae=document.activeElement;if(ae&&(ae.id==='fn'||ae.id==='ln'||ae.id==='ci'||ae.id==='s'))return;
  document.getElementById('app').innerHTML=h;renderList()}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){view=b.dataset.v;say('');render()}});
var loaded={};function mark(k){loaded[k]=1;if(loaded.c&&loaded.r&&loaded.s){ready=true;render()}}
function err(e){say('Could not load data: '+(e&&e.message||e))}
claude.use('db').then(function(d){
  if(!d){say('Open this page from the claude.ai share link while signed in to use shared data.');return}
  db=d;
  db.collection('cadets').onSnapshot(function(s){cad=s.docs.map(function(x){return{id:x.id,name:x.data().name,capid:x.data().capid||''}}).sort(function(a,b){return a.name.localeCompare(b.name)});mark('c');if(view==='run'&&cur.start)renderList();else render()},err);
  db.collection('results').onSnapshot(function(s){res=s.docs.map(function(x){return x.data()});mark('r');if(view==='run'&&cur.start)renderList();else render()},err);
  db.doc('state/today').onSnapshot(function(s){today=(s.exists&&s.data().ids)||[];if(ready){if(view==='run'&&cur.start)renderList();else render()}},err);
  db.doc('state/current').onSnapshot(function(s){var p=cur.start,ps=cur.stopped||0;cur=(s.exists&&s.data())||{start:null,runId:null};mark('s');if(p!==cur.start||ps!==(cur.stopped||0))render();else renderList()},err);
}).catch(err);
setTimeout(function(){if(!ready&&!db)say('Open this page from the claude.ai share link while signed in to use shared data.')},10000);
</script></body></html>
