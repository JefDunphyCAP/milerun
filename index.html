<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCCS Cadet Fitness Tracker</title>

<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mute:#5b6577;--acc:#1d4ed8;--ok:#15803d;--line:#d5dae3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa6bd;--acc:#6b9bff;--ok:#4ade80;--line:#2b3956}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:640px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:0 0 8px}
nav{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
nav button{flex:0 0 auto;font-size:0.85rem;padding:8px 10px;}
button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.on,button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.clock{font-size:2.8rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0;letter-spacing:1px;}
input[type="text"], input[type="password"], input[type="number"]{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin-bottom:8px}
.g{display:flex;gap:8px;flex-wrap:wrap}.g>*{flex:1}
.msg{min-height:1.4em;color:var(--mute);margin-bottom:8px}
.view-section { display: none; }
.view-section.active { display: block; }
ul { padding-left: 0; list-style: none; margin: 8px 0; }
li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.runner-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stop-btn { background: #dc2626; color: white; border: none; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
.stop-btn:disabled { background: #9ca3af; cursor: not-allowed; }
.time-display { font-variant-numeric: tabular-nums; font-weight: bold; font-size: 1.1rem; }
.done-time { color: var(--ok); }
.history-card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.metric-boxes { display: flex; gap: 6px; margin-top: 6px; }
.metric-box { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; font-size: 0.8rem; }
.metric-box span { display: block; font-weight: bold; font-size: 0.95rem; color: var(--ok); margin-top: 2px; }
#auth-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
