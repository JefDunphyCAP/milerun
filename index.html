<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mile Run Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        /* Login Overlay Styles */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 300px;
        }
        .login-box h2 {
            margin-top: 0;
            color: #1a1a1a;
        }
        .login-box input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .login-box button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover {
            background-color: #004085;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        /* Main App Container */
        #app-container {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* Tracker specific styles can go here */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button.action-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button.action-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- Login Screen Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Site Access</h2>
            <p>Please enter the password to continue.</p>
            <input type="password" id="password-input" placeholder="Password">
            <br>
            <button onclick="checkPassword()">Enter</button>
            <div id="error-msg" class="error-msg">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- Main Application Content -->
    <div id="app-container">
        <h1>Mile Run Tracker</h1>
        <p>Track cadet mile run times and progress below.</p>
        
        <div class="form-group">
            <label for="cadet-name">Cadet Name:</label>
            <input type="text" id="cadet-name" placeholder="Enter cadet's name">
        </div>
        <div class="form-group">
            <label for="run-time">Run Time (e.g., 8:30):</label>
            <input type="text" id="run-time" placeholder="MM:SS">
        </div>
        <button class="action-btn" onclick="addRunRecord()">Add Record</button>

        <h3>Recorded Times</h3>
        <table id="runs-table">
            <thead>
                <tr>
                    <th>Cadet Name</th>
                    <th>Time</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="runs-tbody">
                <!-- Records will populate here -->
            </tbody>
        </table>
    </div>

    <script>
        function checkPassword() {
            const inputVal = document.getElementById('password-input').value;
            const correctPassword = 'RCCSmile';
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === correctPassword) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        }

        // Allow pressing 'Enter' to submit the password
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function addRunRecord() {
            const name = document.getElementById('cadet-name').value;
            const time = document.getElementById('run-time').value;
            
            if(!name || !time) {
                alert('Please fill out both fields.');
                return;
            }

            const tbody = document.getElementById('runs-tbody');
            const row = document.createElement('tr');
            
            const dateStr = new Date().toLocaleDateString();
            
            row.innerHTML = `<td>${name}</td><td>${time}</td><td>${dateStr}</td>`;
            tbody.appendChild(row);

            // Clear inputs
            document.getElementById('cadet-name').value = '';
            document.getElementById('run-time').value = '';
        }
    </script>

</body>
</html>
