<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCCS Cadet Mile Run Tracker</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mute:#5b6577;--acc:#1d4ed8;--ok:#15803d;--line:#d5dae3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa6bd;--acc:#6b9bff;--ok:#4ade80;--line:#2b3956}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:640px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1}
button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.on,button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.clock{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.m{color:var(--mute);font-size:.9rem}.t{font-variant-numeric:tabular-nums;font-weight:600}.done .t{color:var(--ok)}
input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.g{display:flex;gap:8px;flex-wrap:wrap}.g>*{flex:1}
.big{padding:14px 18px;min-width:96px}.big:active{transform:scale(.97)}.msg{min-height:1.4em;color:var(--mute)}.tbl{overflow-x:auto}
.view-section { display: none; }
.view-section.active { display: block; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<h1>RCCS Cadet Mile Run Tracker <button id="so" onclick="logout()" style="float:right;font-size:.8rem;padding:6px 10px" hidden>Sign out</button></h1>

<nav>
  <button data-v="run" class="on">Run</button>
  <button data-v="roster">Roster</button>
  <button data-v="hist">History</button>
</nav>
<div id="msg" class="msg" role="status"></div>

<!-- View Sections -->
<div id="view-run" class="view-section active card">
  <h2>Run View</h2>
  <p>Track your active mile run timers and times here.</p>
</div>

<div id="view-roster" class="view-section card">
  <h2>Roster View</h2>
  <p>Manage cadet names and groups here.</p>
</div>

<div id="view-hist" class="view-section card">
  <h2>History View</h2>
  <p>Review past run logs and results here.</p>
</div>

<script>
  // Tab switching script
  const buttons = document.querySelectorAll('nav button');
  const sections = document.querySelectorAll('.view-section');

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      // Highlight active button
      buttons.forEach(btn => btn.classList.remove('on'));
      button.classList.add('on');
      
      // Get target view key
      const targetView = button.getAttribute('data-v');
      
      // Show matching section, hide others
      sections.forEach(section => {
        if (section.id === 'view-' + targetView) {
          section.classList.add('active');
        } else {
          section.classList.remove('active');
        }
      });
    });
  });

  function logout() {
    // Add your sign out logic here
  }
</script>
</body>
</html>
