<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCCS Cadet Mile Run Tracker</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mute:#5b6577;--acc:#1d4ed8;--ok:#15803d;--line:#d5dae3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa6bd;--acc:#6b9bff;--ok:#4ade80;--line:#2b3956}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:640px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1}
button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.on,button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin-bottom:8px}
.g{display:flex;gap:8px;flex-wrap:wrap}.g>*{flex:1}
.msg{min-height:1.4em;color:var(--mute);margin-bottom:8px}
.view-section { display: none; }
.view-section.active { display: block; }
ul { padding-left: 20px; margin: 8px 0; }
li { margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.del-btn { background: #dc2626; color: white; border: none; padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; }
</style>
</head>
<body>
<h1>RCCS Cadet Mile Run Tracker</h1>

<nav>
  <button data-v="run" class="on">Run</button>
  <button data-v="roster">Roster</button>
  <button data-v="hist">History</button>
</nav>

<!-- Run View -->
<div id="view-run" class="view-section active card">
  <h2>Record Cadet Run</h2>
  <label for="run-cadet-select">Select Cadet:</label>
  <select id="run-cadet-select">
    <option value="">-- Add cadets in Roster first --</option>
  </select>
  
  <label for="run-time-input">Time (MM:SS):</label>
  <input type="text" id="run-time-input" placeholder="e.g. 07:45">
  
  <button onclick="saveRun()" class="p" style="width:100%">Save Run Time</button>
  <p id="run-msg" class="msg" style="margin-top:8px;"></p>
</div>

<!-- Roster View -->
<div id="view-roster" class="view-section card">
  <h2>Manage Roster</h2>
  <div class="g">
    <input type="text" id="cadet-name-input" placeholder="Cadet Full Name">
    <button onclick="addCadet()" class="p">Add Cadet</button>
  </div>
  <h3>Roster List</h3>
  <ul id="cadet-list">
    <li class="m" style="color:var(--mute);">No cadets added yet.</li>
  </ul>
</div>

<!-- History View -->
<div id="view-hist" class="view-section card">
  <h2>Run History</h2>
  <ul id="history-list">
    <li class="m" style="color:var(--mute);">No runs recorded yet.</li>
  </ul>
</div>

<script>
  // Tab Switching
  const buttons = document.querySelectorAll('nav button');
  const sections = document.querySelectorAll('.view-section');

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      buttons.forEach(btn => btn.classList.remove('on'));
      button.classList.add('on');
      const targetView = button.getAttribute('data-v');
      sections.forEach(section => {
        section.classList.toggle('active', section.id === 'view-' + targetView);
      });
    });
  });

  // App Data State (stored in browser localStorage so it saves on your phone)
  let cadets = JSON.parse(localStorage.getItem('rccs_cadets')) || [];
  let history = JSON.parse(localStorage.getItem('rccs_history')) || [];

  function saveData() {
    localStorage.setItem('rccs_cadets', JSON.stringify(cadets));
    localStorage.setItem('rccs_history', JSON.stringify(history));
  }

  // Roster Management
  function addCadet() {
    const input = document.getElementById('cadet-name-input');
    const name = input.value.trim();
    if (!name) return;

    cadets.push(name);
    input.value = '';
    saveData();
    renderAll();
  }

  function removeCadet(index) {
    cadets.splice(index, 1);
    saveData();
    renderAll();
  }

  // Run Logging
  function saveRun() {
    const select = document.getElementById('run-cadet-select');
    const timeInput = document.getElementById('run-time-input');
    const msg = document.getElementById('run-msg');
    
    const cadet = select.value;
    const time = timeInput.value.trim();

    if (!cadet) {
      msg.textContent = "Please select a cadet.";
      return;
    }
    if (!time) {
      msg.textContent = "Please enter a run time.";
      return;
    }

    history.unshift({ cadet, time, date: new Date().toLocaleDateString() });
    timeInput.value = '';
    msg.textContent = `Saved run for ${cadet}!`;
    saveData();
    renderAll();

    setTimeout(() => { msg.textContent = ""; }, 3000);
  }

  // Render All UI Elements
  function renderAll() {
    // Render Roster List
    const cadetListEl = document.getElementById('cadet-list');
    if (cadets.length === 0) {
      cadetListEl.innerHTML = '<li style="color:var(--mute);">No cadets added yet.</li>';
    } else {
      cadetListEl.innerHTML = cadets.map((c, i) => `
        <span>${c}</span>
        <button class="del-btn" onclick="removeCadet(${i})">Delete</button>
      `).join('');
    }

    // Render Dropdown Select
    const selectEl = document.getElementById('run-cadet-select');
    if (cadets.length === 0) {
      selectEl.innerHTML = '<option value="">-- Add cadets in Roster first --</option>';
    } else {
      selectEl.innerHTML = '<option value="">-- Select Cadet --</option>' + 
        cadets.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // Render History List
    const historyListEl = document.getElementById('history-list');
    if (history.length === 0) {
      historyListEl.innerHTML = '<li style="color:var(--mute);">No runs recorded yet.</li>';
    } else {
      historyListEl.innerHTML = history.map(h => `
        <span><strong>${h.cadet}</strong> - ${h.time}</span>
        <span style="color:var(--mute);font-size:0.85rem">${h.date}</span>
      `).join('');
    }
  }

  // Initial load render
  renderAll();
</script>
</body>
</html>
