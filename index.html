<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Paste all your original <head> contents, styles, and scripts here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mile Run Tracker</title>
    
    <style>
        /* Login Overlay Styles */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 300px;
            font-family: Arial, sans-serif;
        }
        .login-box h2 {
            margin-top: 0;
            color: #1a1a1a;
        }
        .login-box input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .login-box button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover {
            background-color: #004085;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* This keeps your original site hidden initially */
        #protected-content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Password Login Gate Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Site Access</h2>
            <p>Please enter the password to continue.</p>
            <input type="password" id="password-input" placeholder="Password">
            <br>
            <button onclick="checkPassword()">Enter</button>
            <div id="error-msg" class="error-msg">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- 2. WRAPPER FOR YOUR ORIGINAL SITE -->
    <div id="protected-content">
        
        <!-- PASTE ALL YOUR ORIGINAL BODY HTML CONTENT HERE -->
        <!-- (Everything you had inside your <body> before adding the password) -->

    </div>

    <!-- Password Verification Script -->
    <script>
        function checkPassword() {
            const inputVal = document.getElementById('password-input').value;
            const correctPassword = 'RCCSmile';
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === correctPassword) {
                // Hide the login screen and show your original site
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        }

        // Allow pressing 'Enter' to submit the password
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
